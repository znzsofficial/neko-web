name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
        sdk: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum SDK
        if: matrix.sdk == 'minimum'
        run: python -m pip install "maibot-plugin-sdk==2.12.0" "httpx>=0.26" "aiohttp>=3.12" "Pillow>=12" tzdata ruff
      - name: Install latest SDK
        if: matrix.sdk == 'latest'
        run: python -m pip install "maibot-plugin-sdk>=2.12,<3" "httpx>=0.26" "aiohttp>=3.12" "Pillow>=12" tzdata ruff
      - name: Report actual runtime
        run: python -c "import sys,importlib.metadata as m; print(sys.version); print({x:m.version(x) for x in ['maibot-plugin-sdk','httpx','aiohttp','Pillow','tzdata']})"
      - name: Tests with discovery and skip gates
        run: python scripts/ci.py
      - name: Fatal Python lint
        run: python -m ruff check --select E9,F63,F7,F82 .
      - name: Build and import extracted package
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neko-web-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.sdk }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
